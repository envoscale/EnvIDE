# Builds Envide with EnvoScale at envoscale.ref and runs its tests on Linux and Windows;
# on Linux it also opens Envide's window under a virtual X server and draws a frame.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: ./build.sh test
      - run: ./build.sh build
      - run: |
          out=$(xvfb-run -a build/envide --one-frame)
          echo "$out"
          [ "$out" = "envide: drew a frame" ]
      - run: |
          build/envide . main.envol --screenshot shot.ppm --size 640x400
          [ "$(head -c 2 shot.ppm)" = P6 ]
      - run: cp build/envide envide-x86_64-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: envide-linux
          path: envide-x86_64-linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: ./build.sh test
        shell: bash
      - run: ./build.sh build
        shell: bash
      - run: |
          build/envide.exe . main.envol --screenshot shot.ppm --size 640x400
          [ "$(head -c 2 shot.ppm)" = P6 ]
        shell: bash
      - run: cp build/envide.exe envide-x86_64-windows.exe
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: envide-windows
          path: envide-x86_64-windows.exe

  # A tag v* publishes Envide for Linux and Windows.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Envide $GITHUB_REF_NAME" --notes "The Envide shell: a sidebar with the folder's files, tabs, the code editor, a status bar and a command palette (Ctrl+Shift+P). Run it in a folder to see that folder. Built with EnvoScale at the commit in envoscale.ref."
