# Builds Studio with EnvoScale at envoscale.ref and runs its tests on Linux and Windows;
# on Linux it also opens Studio's window under a virtual X server and draws a frame.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: ./build.sh test
      - run: ./build.sh build
      - run: |
          out=$(xvfb-run -a build/studio --one-frame)
          echo "$out"
          [ "$out" = "studio: drew a frame" ]

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: ./build.sh test
        shell: bash
      - run: ./build.sh build
        shell: bash
